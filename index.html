<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack Personal Finance</title>
    <link rel="stylesheet" href="styles.css?v=20260513-dashboard-currency" />
  </head>
  <body>
    <div id="authScreen" class="auth-screen">
      <section class="auth-panel" aria-labelledby="authTitle">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">F</div>
          <div>
            <h1 id="authTitle">FinTrack</h1>
            <p>Personal finance, organized.</p>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication">
          <button class="auth-tab active" data-auth-tab="login" type="button">Login</button>
          <button class="auth-tab" data-auth-tab="register" type="button">Register</button>
        </div>

        <form id="loginForm" class="auth-form" data-auth-form="login">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit">Login</button>
        </form>

        <form id="registerForm" class="auth-form hidden" data-auth-form="register">
          <label>
            Name
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" minlength="6" required />
          </label>
          <button class="primary-button" type="submit">Create account</button>
        </form>
        <p id="authMessage" class="form-message" role="status"></p>
      </section>
    </div>

    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark coin-mark" aria-hidden="true">◆</div>
          <span>COINEST</span>
        </div>
        <nav class="nav-list" aria-label="Main">
          <button class="nav-item active" data-view="dashboard" type="button"><span>▦</span>Dashboard</button>
          <button class="nav-item" data-view="transactions" type="button"><span>↔</span>Transactions</button>
          <button class="nav-item" data-view="budgets" type="button"><span>▤</span>Budgets</button>
          <button class="nav-item" data-view="goals" type="button"><span>◇</span>Saving Plans</button>
          <button class="nav-item" data-view="reports" type="button"><span>◷</span>Insights</button>
          <button class="nav-item" data-view="accounts" type="button"><span>▣</span>Accounts</button>
        </nav>
        <div class="sidebar-promo">
          <div class="promo-icon" aria-hidden="true">▣</div>
          <p>Gain full access to detailed analytics and graphs</p>
          <button class="primary-button" type="button">Get Pro</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div>
            <h2 id="viewTitle">Dashboard</h2>
          </div>
          <div class="topbar-actions">
            <label class="search-box" aria-label="Search">
              <input id="globalSearch" type="search" placeholder="Search placeholder" />
              <span>⌕</span>
            </label>
            <button class="round-button" type="button" aria-label="Messages">☵</button>
            <button class="round-button" type="button" aria-label="Notifications">◔</button>
            <select id="currencySelect" class="currency-select" aria-label="Currency">
              <option value="USD">USD</option>
              <option value="VND">VND</option>
            </select>
            <span id="activeUser" class="user-chip"></span>
            <button id="logoutButton" class="ghost-button" type="button">Logout</button>
          </div>
        </header>

        <section id="dashboardView" class="view active-view"></section>
        <section id="transactionsView" class="view"></section>
        <section id="budgetsView" class="view"></section>
        <section id="goalsView" class="view"></section>
        <section id="reportsView" class="view"></section>
        <section id="accountsView" class="view"></section>
      </main>
    </div>

    <script src="app.js?v=20260513-dashboard-currency"></script>
  </body>
</html>
